name: "Bootstrap"
description: "Bootstrap all tools and dependencies"
inputs:
  python-version:
    description: "Python version to install"
    required: true
    default: "3.13"
  cache-key-prefix:
    description: "Prefix all cache keys with this value"
    required: true
    default: "4f1a2c7e"
runs:
  using: "composite"
  steps:
    # go builds yardstick (see .binny.yaml). go-make/setup also owns the tool cache, which uses
    # restore-only caching on non-default branches and forks to prevent cache poisoning.
    - name: Setup go and tool cache
      uses: anchore/go-make/.github/actions/setup@27a9f35f41b5fe86d68815844efd2ba816e9ba6b # v0.9.1
      with:
        go-version: stable
        # this repo has no go.mod
        go-version-file: ""
        cache-key-prefix: ${{ inputs.cache-key-prefix }}

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install tools
      shell: bash
      run: make tools
